<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lillian's Reading Adventure ⭐</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --pink: #FF6B9D;
    --purple: #C084FC;
    --blue: #60A5FA;
    --green: #34D399;
    --yellow: #FBBF24;
    --orange: #FB923C;
    --red: #F87171;
    --bg: #FFF7ED;
    --card: #FFFFFF;
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg) url('20240108_160702.jpg') center/cover no-repeat fixed;
    height: 100vh; height: 100dvh;
    overflow: hidden;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Floating background shapes */
  .bg-shapes {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; overflow: hidden;
  }
  .bg-shape {
    position: absolute; border-radius: 50%; opacity: 0.12;
    animation: floatShape 8s ease-in-out infinite;
  }
  .bg-shape:nth-child(1) { width:200px;height:200px;background:var(--pink);top:10%;left:-5%;animation-delay:0s; }
  .bg-shape:nth-child(2) { width:150px;height:150px;background:var(--purple);top:60%;right:-3%;animation-delay:2s; }
  .bg-shape:nth-child(3) { width:180px;height:180px;background:var(--blue);bottom:5%;left:30%;animation-delay:4s; }
  .bg-shape:nth-child(4) { width:120px;height:120px;background:var(--yellow);top:25%;right:20%;animation-delay:1s; }
  .bg-shape:nth-child(5) { width:100px;height:100px;background:var(--green);top:50%;left:15%;animation-delay:3s; }

  @keyframes floatShape {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(5deg); }
  }

  /* Header / HUD */
  .hud {
    position: relative; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 16px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: white;
    box-shadow: 0 4px 20px rgba(192, 132, 252, 0.3);
  }
  .hud-name {
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.15);
  }
  .hud-stats {
    display: flex; gap: 16px; align-items: center;
  }
  .hud-stat {
    display: flex; align-items: center; gap: 5px;
    font-weight: 700; font-size: 0.85rem;
    background: rgba(255,255,255,0.2);
    padding: 3px 10px; border-radius: 20px;
  }
  .hud-stat .emoji { font-size: 1.2rem; }

  /* Progress bar */
  .progress-wrap {
    position: relative; z-index: 10;
    height: 5px; background: rgba(192, 132, 252, 0.15);
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--yellow), var(--orange));
    transition: width 0.5s ease;
    border-radius: 0 4px 4px 0;
  }

  /* Main game area */
  .game-container {
    position: relative; z-index: 10;
    max-width: 600px; margin: 0 auto;
    padding: 8px 14px;
    display: flex; flex-direction: column; align-items: center;
    height: calc(100vh - 50px); height: calc(100dvh - 50px);
    overflow: hidden;
    background: rgba(255, 247, 237, 0.85);
    border-radius: 0 0 18px 18px;
  }

  /* Screens */
  .screen { display: none; width: 100%; text-align: center; }
  .screen.active { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: center; }
  #screen-game.active { justify-content: flex-start; }

  /* Welcome screen */
  .welcome-title {
    font-family: 'Fredoka One', cursive;
    font-size: 2.2rem;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  .welcome-sub {
    font-size: 1.1rem; color: #888; margin-bottom: 30px; font-weight: 600;
  }
  .welcome-mascot {
    font-size: 4.5rem; margin-bottom: 12px;
    animation: bounce 2s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  .btn-play {
    font-family: 'Fredoka One', cursive;
    font-size: 1.8rem;
    padding: 18px 60px;
    border: none; border-radius: 50px; cursor: pointer;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: white;
    box-shadow: 0 8px 25px rgba(255, 107, 157, 0.4);
    transition: transform 0.15s, box-shadow 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-play:active {
    transform: scale(0.95);
    box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
  }

  /* Question area */
  .question-card {
    background: var(--card);
    border-radius: 18px;
    padding: 12px 14px;
    width: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    margin-bottom: 6px;
    flex-shrink: 1;
    overflow: hidden;
  }
  .question-prompt {
    font-size: 0.8rem; color: #aaa; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .question-display {
    font-size: 2.2rem; font-weight: 800;
    color: #334155;
    line-height: 1.2;
    min-height: 50px;
    display: flex; align-items: center; justify-content: center;
  }
  .question-display .picture-emoji {
    font-size: 3.8rem;
  }
  .question-display.sentence-mode {
    font-size: 1.3rem;
  }
  .question-display.passage-mode {
    font-size: 1rem;
    flex-direction: column;
    text-align: left;
    gap: 6px;
    min-height: auto;
  }
  .passage-text {
    font-size: 0.88rem;
    line-height: 1.5;
    color: #475569;
    font-weight: 600;
    background: #F8FAFC;
    border-radius: 10px;
    padding: 10px 12px;
    border-left: 4px solid var(--purple);
    max-height: 28vh;
    overflow-y: auto;
  }
  .passage-question {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--pink);
    text-align: center;
  }
  .question-hint {
    margin-top: 4px; font-size: 0.8rem; color: #94a3b8; font-weight: 600;
  }

  /* Answer buttons */
  .answers-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    width: 100%;
    margin-bottom: 4px;
    flex-shrink: 0;
  }
  .answers-grid.single-col {
    grid-template-columns: 1fr;
  }

  .answer-btn {
    font-family: 'Nunito', sans-serif;
    font-size: 1.25rem; font-weight: 800;
    padding: 12px 10px;
    border: 3px solid #E2E8F0;
    border-radius: 16px;
    background: white;
    color: #334155;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    min-height: 48px;
    display: flex; align-items: center; justify-content: center;
    word-break: break-word;
  }
  .answer-btn:active {
    transform: scale(0.96);
  }
  .answer-btn.correct {
    background: var(--green); color: white; border-color: var(--green);
    animation: popCorrect 0.4s ease;
  }
  .answer-btn.wrong {
    background: var(--red); color: white; border-color: var(--red);
    animation: shake 0.4s ease;
  }
  @keyframes popCorrect {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  .answer-btn.sentence-opt {
    font-size: 0.95rem;
    padding: 10px 10px;
    text-align: left;
    min-height: 40px;
  }

  /* Feedback area */
  .feedback {
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    min-height: 28px;
    margin-bottom: 2px;
    transition: opacity 0.3s;
    flex-shrink: 0;
  }
  .feedback.correct-fb { color: var(--green); }
  .feedback.wrong-fb { color: var(--red); }

  /* Streak indicator */
  .streak-bar {
    display: flex; gap: 4px; align-items: center;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  .streak-star {
    font-size: 1rem;
    transition: all 0.3s;
    opacity: 0.2;
  }
  .streak-star.lit {
    opacity: 1;
    animation: starPop 0.4s ease;
  }
  @keyframes starPop {
    0% { transform: scale(0.5) rotate(-20deg); }
    60% { transform: scale(1.3) rotate(5deg); }
    100% { transform: scale(1) rotate(0); }
  }

  /* Level up overlay */
  .overlay {
    display: none;
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    justify-content: center; align-items: center;
    padding: 20px;
  }
  .overlay.active { display: flex; }

  .levelup-card {
    background: white; border-radius: 30px;
    padding: 20px 20px; text-align: center;
    max-width: 95vw; width: 100%;
    animation: slideUp 0.5s ease;
    max-height: 95vh;
    overflow-y: auto;
  }
  @keyframes slideUp {
    from { transform: translateY(60px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .levelup-emoji { font-size: 3rem; margin-bottom: 6px; }
  .levelup-title {
    font-family: 'Fredoka One', cursive;
    font-size: 2rem;
    background: linear-gradient(135deg, var(--yellow), var(--orange));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
  }
  .levelup-msg {
    font-size: 1rem; color: #64748B; font-weight: 600;
    margin-bottom: 10px;
  }
  .video-container {
    width: 100%; aspect-ratio: 16/9;
    border-radius: 16px; overflow: hidden;
    margin-bottom: 12px;
    background: #1e1e2e;
    max-height: 60vh;
  }
  .video-container iframe {
    width: 100%; height: 100%; border: none;
  }
  .video-placeholder {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #94a3b8; font-weight: 700;
  }
  .video-placeholder .emoji { font-size: 3rem; margin-bottom: 8px; }

  .btn-continue {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    padding: 14px 50px;
    border: none; border-radius: 50px; cursor: pointer;
    background: linear-gradient(135deg, var(--green), #059669);
    color: white;
    box-shadow: 0 6px 20px rgba(52, 211, 153, 0.4);
    transition: transform 0.15s;
  }
  .btn-continue:active { transform: scale(0.95); }

  /* Confetti */
  .confetti-piece {
    position: fixed; z-index: 200;
    width: 10px; height: 10px;
    pointer-events: none;
  }

  /* Sound toggle */
  .sound-toggle {
    position: fixed; bottom: 16px; right: 16px;
    z-index: 50;
    width: 48px; height: 48px;
    border-radius: 50%;
    border: none;
    background: white;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    font-size: 1.4rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  /* Completion screen */
  .completion-emoji { font-size: 6rem; margin-bottom: 16px; }
  .completion-title {
    font-family: 'Fredoka One', cursive;
    font-size: 2rem;
    color: var(--purple);
    margin-bottom: 10px;
  }
  .completion-stats {
    font-size: 1.1rem; color: #64748B; font-weight: 600;
    margin-bottom: 30px; line-height: 2;
  }

  /* Responsive */
  @media (max-width: 400px) {
    .welcome-title { font-size: 1.5rem; }
    .question-display { font-size: 1.8rem; }
    .answer-btn { font-size: 1rem; padding: 8px 8px; min-height: 40px; }
    .answer-btn.sentence-opt { font-size: 0.85rem; padding: 7px 8px; min-height: 34px; }
    .hud-name { font-size: 0.9rem; }
    .passage-text { font-size: 0.8rem; padding: 8px 10px; max-height: 24vh; }
    .passage-question { font-size: 0.95rem; }
    .question-card { padding: 10px 12px; }
  }
</style>
</head>
<body>

<div class="bg-shapes">
  <div class="bg-shape"></div>
  <div class="bg-shape"></div>
  <div class="bg-shape"></div>
  <div class="bg-shape"></div>
  <div class="bg-shape"></div>
</div>

<!-- HUD -->
<div class="hud" id="hud" style="display:none;">
  <div class="hud-name">Lillian's Adventure</div>
  <div class="hud-stats">
    <div class="hud-stat"><span class="emoji">⭐</span><span id="hud-points">0</span></div>
    <div class="hud-stat"><span class="emoji">🏆</span>Lv <span id="hud-level">1</span></div>
  </div>
</div>
<div class="progress-wrap" id="progress-wrap" style="display:none;">
  <div class="progress-bar" id="progress-bar" style="width:0%"></div>
</div>

<div class="game-container">

  <!-- WELCOME SCREEN -->
  <div class="screen active" id="screen-welcome">
    <div class="welcome-mascot">📚</div>
    <div class="welcome-title">Lillian's Reading Adventure!</div>
    <div class="welcome-sub">Tap the right answers to earn stars!</div>
    <button class="btn-play" id="btn-start" onclick="startGame()">Let's Read!</button>
  </div>

  <!-- GAME SCREEN -->
  <div class="screen" id="screen-game">
    <div class="streak-bar" id="streak-bar">
      <div class="streak-star" id="ss1">⭐</div>
      <div class="streak-star" id="ss2">⭐</div>
      <div class="streak-star" id="ss3">⭐</div>
      <div class="streak-star" id="ss4">⭐</div>
      <div class="streak-star" id="ss5">⭐</div>
      <div class="streak-star" id="ss6">⭐</div>
      <div class="streak-star" id="ss7">⭐</div>
      <div class="streak-star" id="ss8">⭐</div>
      <div class="streak-star" id="ss9">⭐</div>
      <div class="streak-star" id="ss10">⭐</div>

    <div class="question-card">

      <div class="question-display" id="q-display"></div>
      <div class="question-hint" id="q-hint"></div>
    </div>
    <div class="feedback" id="feedback">&nbsp;</div>
    <div class="answers-grid" id="answers-grid"></div>
  </div>

  <!-- COMPLETION SCREEN -->
  <div class="screen" id="screen-complete">
    <div class="completion-emoji">🎉🏆🌟</div>
    <div class="completion-title">Amazing Job, Lillian!</div>
    <div class="completion-stats" id="completion-stats"></div>
    <button class="btn-play" onclick="resetGame()">Play Again!</button>
  </div>
</div>

<!-- LEVEL UP OVERLAY -->
<div class="overlay" id="overlay-levelup">
  <div class="levelup-card">
    <div class="levelup-emoji" id="lu-emoji">🎉</div>
    <div class="levelup-title" id="lu-title">Level Up!</div>
    <div class="levelup-msg" id="lu-msg">You're doing amazing, Lillian!</div>
    <div class="video-container" id="lu-video-container">
      <div class="video-placeholder" id="lu-video-placeholder">
        <div class="emoji">🎬</div>
        <div>Video reward coming soon!</div>
      </div>
    </div>
    <button class="btn-continue" onclick="closeLevelUp()">Keep Reading! ➜</button>
  </div>
</div>

<!-- Audio context for simple sounds -->
<button class="sound-toggle" id="sound-toggle" onclick="toggleSound()">🔊</button>

  { passage: "Mateo's class collected cans of food for a food drive. The class that collected the most cans would win a pizza party. Mateo's class collected 147 cans, but Ms. Rivera's class collected 162. Mateo was disappointed but still felt proud of what his class did.", question: "Why was Mateo disappointed?", answer: "His class did not collect the most cans", options: ["His class did not collect the most cans", "He didn't like pizza", "They didn't collect any cans", "The food drive was canceled"] },
  { passage: "Anya always carried a small notebook. Whenever she saw something interesting — a funny cloud, a cool bug, or a pretty sunset — she wrote about it. Her teacher said, 'Anya, you notice things most people walk right past.' Anya smiled because that was exactly what she wanted to do.", question: "What kind of person is Anya?", answer: "She is observant and curious", options: ["She is observant and curious", "She is shy and quiet", "She is always in a hurry", "She doesn't like school"] },

  { passage: "During the storm, the power went out at school. The hallways were dark and some kids were scared. The principal came on the loudspeaker and said, 'Everyone stay calm. We have flashlights and the power will be back soon.' The teachers passed out glow sticks so the kids could see.", question: "How did the school help the kids feel safe?", answer: "They gave calm instructions and handed out glow sticks", options: ["They gave calm instructions and handed out glow sticks", "They sent everyone home", "They lit a campfire", "They ignored the problem"] },

  { passage: "The weather report said it would be sunny all week, so Maya's class planned an outdoor science lesson for Thursday. But on Wednesday night, it rained hard. Thursday morning the field was muddy and full of puddles. The teacher moved the lesson to the gym instead.", question: "Why did the teacher change the plan?", answer: "The field was too muddy from the rain", options: ["The field was too muddy from the rain", "The gym was more fun", "The students asked to go inside", "It was still raining on Thursday"] },
  { passage: "Kai's grandfather told him stories about growing up on a farm. He said he woke up at dawn to feed the chickens and milk the cows. He walked two miles to school every day. Kai thought about his own morning — waking up, eating cereal, and riding the bus. Their mornings were very different.", question: "What is the main idea of this passage?", answer: "Life was different when Grandpa was young", options: ["Life was different when Grandpa was young", "Kai doesn't like school", "Grandpa didn't like farming", "Buses are better than walking"] },
  { passage: "Mira's tooth fairy money had been adding up in her piggy bank for months. She wanted to buy a toy that cost eight dollars. She counted her coins: three dollars and twenty-five cents. She decided to do chores to earn the rest. After washing the car and raking leaves, she finally had enough.", question: "How much more money did Mira need to earn?", answer: "About five dollars", options: ["About five dollars", "Eight dollars", "Three dollars", "One dollar"] },
  { passage: "The class was learning about recycling. They found out that one aluminum can takes about 500 years to break down in a landfill, but if you recycle it, it can become a new can in just 60 days. The students started a recycling bin in every classroom.", question: "Why did the students start recycling bins?", answer: "They learned how long trash takes to break down", options: ["They learned how long trash takes to break down", "The teacher made them", "They wanted new cans", "Recycling bins look nice"] },
  { passage: "Bea was nervous about her piano recital. She had practiced her song fifty times, but her hands still felt shaky. When she sat down at the piano, she took a deep breath and pretended she was playing in her living room at home. Her fingers relaxed, and she played the song perfectly.", question: "What helped Bea play well?", answer: "She calmed herself by imagining she was at home", options: ["She calmed herself by imagining she was at home", "She didn't practice enough", "Someone helped her play", "She played a different song"] },
  { passage: "Two brothers were arguing about which movie to watch. Ethan wanted an action movie and Lucas wanted a comedy. Their dad said, 'Why don't you each pick one, and we'll watch both — one tonight and one tomorrow?' Both boys agreed and shook hands.", question: "How did Dad solve the problem?", answer: "He suggested a fair compromise", options: ["He suggested a fair compromise", "He picked a different movie", "He said no movies at all", "He let only one boy choose"] },
  { passage: "Every day after school, Tanya walked past a house with a big garden. She noticed that the flowers were drooping and the grass was brown. One afternoon she saw an elderly woman trying to carry a heavy watering can. Tanya offered to help, and soon she was visiting every day to water the garden.", question: "Why were the flowers drooping?", answer: "The elderly woman couldn't water them by herself", options: ["The elderly woman couldn't water them by herself", "It was winter", "Someone cut them", "There was too much sun"] },
  { passage: "Ravi's class made a time capsule. Each student put in something that represented them. Ravi put in a drawing of his family, a baseball card, and a letter about his favorite things. They buried the box under the school oak tree and planned to dig it up in five years.", question: "Why did they bury the time capsule?", answer: "So they could open it and remember this time in the future", options: ["So they could open it and remember this time in the future", "They didn't want their things anymore", "The teacher told them to throw things away", "They were hiding a treasure"] },
  { passage: "Layla noticed that her friend Priya was sitting alone at lunch and not eating. She wasn't talking to anyone and kept looking at the ground. Layla sat down next to her and asked, 'Are you okay?' Priya's eyes filled with tears and she said her dog was very sick.", question: "How could Layla tell something was wrong with Priya?", answer: "Priya was sitting alone and not eating or talking", options: ["Priya was sitting alone and not eating or talking", "Priya told her earlier", "The teacher said something", "Priya was yelling"] },
  { passage: "Oscar entered the spelling bee even though he was nervous. He practiced every night with his mom for three weeks. In the contest, he made it all the way to the final round. The last word was 'necessary.' He took a deep breath, spelled it right, and won first place!", question: "What helped Oscar win the spelling bee?", answer: "Weeks of practice with his mom", options: ["Weeks of practice with his mom", "He was just lucky", "The words were easy", "Someone whispered the answer"] },
  { passage: "The school bus was late on Monday morning. While the kids waited, they noticed ice on the sidewalk and the roads looked shiny and wet. When the bus finally came, the driver said she had to go very slowly because the roads were slippery.", question: "Why was the bus late?", answer: "The icy roads made the driver go slowly", options: ["The icy roads made the driver go slowly", "The driver overslept", "The bus broke down", "There were too many kids"] },
  { passage: "Amira loved reading mystery books. She always tried to figure out the ending before she got there. One night she stayed up past bedtime with a flashlight under her blanket because she was so close to solving the mystery. Her mom found her and said, 'You can finish it tomorrow.'", question: "What does this tell us about Amira?", answer: "She loves reading so much she can't put a book down", options: ["She loves reading so much she can't put a book down", "She is afraid of the dark", "She doesn't follow rules", "She doesn't like sleeping"] },

  { passage: "Sophie packed her suitcase with shorts, sandals, sunscreen, and a swimsuit. Her dad loaded the cooler with cold drinks and watermelon. Mom grabbed beach towels and an umbrella. The whole family was excited for the trip.", question: "Where was the family most likely going?", answer: "To the beach", options: ["To the beach", "To the mountains", "To school", "To a wedding"] },
  { passage: "The maple tree in the backyard changed with every season. In spring it had tiny green buds. In summer it was full of big green leaves that gave cool shade. In fall the leaves turned bright red and orange. In winter the branches were bare and covered in snow.", question: "During which season did the tree give shade?", answer: "summer", options: ["summer", "winter", "spring", "fall"] },
  { passage: "When the new girl, Fatima, started school, she looked nervous and didn't know anyone. At lunch she sat at an empty table. Jaylen saw her sitting alone, walked over, and said, 'Hi, I'm Jaylen. Want to sit with me and my friends?' Fatima's face lit up and she said yes.", question: "How did Jaylen's actions affect Fatima?", answer: "They made her feel welcome and less alone", options: ["They made her feel welcome and less alone", "They made her more nervous", "They didn't change anything", "They made her want to go home"] },

  { passage: "Marcus always finished his classwork quickly and then had nothing to do. His teacher suggested he become a 'reading buddy' for the first graders. Every Tuesday, Marcus read picture books to a boy named Sam. By the end of the year, Sam could read some of the words by himself, and Marcus had found his favorite part of the week.", question: "How did being a reading buddy help both boys?", answer: "Sam learned to read and Marcus found something meaningful to do", options: ["Sam learned to read and Marcus found something meaningful to do", "Only Sam benefited", "Only Marcus benefited", "Neither one liked it"] },
  { passage: "Zara noticed that every time she studied with music playing, she didn't remember as much on the test. When she studied in a quiet room, she got better grades. She decided to do an experiment: study half the material with music and half without. The results were the same — she did better on the quiet half.", question: "What did Zara's experiment prove?", answer: "She learns better without music distracting her", options: ["She learns better without music distracting her", "Music helps her study", "It doesn't matter either way", "She should study more"] },

  { passage: "Milo's family moved to a new town over the summer. On the first day of school, everything felt strange — new hallways, new teachers, and no familiar faces. At recess, a boy named Aiden asked Milo to play soccer. By the end of the week, Milo had three new friends and didn't feel so lost anymore.", question: "What changed Milo's experience at the new school?", answer: "Someone reached out and included him", options: ["Someone reached out and included him", "He transferred back to his old school", "The teachers forced kids to be his friend", "He stayed by himself all week"] },
  { passage: "A girl named Penny wanted to raise money for the animal shelter. She made friendship bracelets and sold them at a stand in front of her house for two dollars each. In one weekend she sold forty-three bracelets. She donated all eighty-six dollars to the shelter, and they used it to buy food and blankets for the animals.", question: "How much money did Penny raise?", answer: "eighty-six dollars", options: ["eighty-six dollars", "forty-three dollars", "two dollars", "one hundred dollars"] },
  { passage: "Mrs. Williams told her class a story about two farmers. One farmer planted his seeds and then sat inside watching TV all summer. The other farmer planted seeds, pulled weeds, watered the crops, and checked for bugs every day. In the fall, only the second farmer had a good harvest. Mrs. Williams asked, 'What can we learn from this?'", question: "What lesson was Mrs. Williams teaching?", answer: "Success takes ongoing effort, not just a good start", options: ["Success takes ongoing effort, not just a good start", "Farming is easy", "Watching TV helps plants grow", "Both farmers did the same work"] },

  { passage: "During a class discussion about fairness, the teacher asked, 'Is it fair if everyone gets the same thing?' One student said yes. But another student, Reese, said, 'Not always. If one person needs glasses to see and another doesn't, giving both glasses isn't fair — it's only fair to give them to the person who needs them.' The teacher said, 'That's a very thoughtful answer.'", question: "What was Reese's point about fairness?", answer: "Fairness means giving people what they need, not always the same thing", options: ["Fairness means giving people what they need, not always the same thing", "Everyone should get glasses", "Fairness doesn't matter", "The teacher was wrong"] },

// ============================================================
//  AUDIO - Simple Web Audio beeps (no files needed)
// ============================================================
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playTone(freq, duration, type = "sine", volume = 0.15) {
  if (!soundOn || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function sfxCorrect() {
  playTone(523, 0.12); // C5
  setTimeout(() => playTone(659, 0.12), 100); // E5
  setTimeout(() => playTone(784, 0.2), 200); // G5
}
function sfxWrong() {
  playTone(200, 0.25, "square", 0.08);
}
function sfxLevelUp() {
  [523, 587, 659, 698, 784, 880, 988, 1047].forEach((f, i) => {
    setTimeout(() => playTone(f, 0.15, "sine", 0.12), i * 80);
  });
}
function sfxClick() {
  playTone(440, 0.06, "sine", 0.08);
}

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById("sound-toggle").textContent = soundOn ? "🔊" : "🔇";
}

// ============================================================
//  GAME FLOW
// ============================================================

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function startGame() {
  initAudio();
  sfxClick();
  points = 0;
  level = 1;
  streak = 0;
  questionsInLevel = 0;
  totalCorrect = 0;
  totalQuestions = 0;
  recentQuestions.clear();
  updateHUD();
  document.getElementById("hud").style.display = "flex";
  document.getElementById("progress-wrap").style.display = "block";
  showScreen("screen-game");
  nextQuestion();
}

function resetGame() {
  sfxClick();
  document.getElementById("hud").style.display = "none";
  document.getElementById("progress-wrap").style.display = "none";
  showScreen("screen-welcome");
}

function updateHUD() {
  document.getElementById("hud-points").textContent = points;
  document.getElementById("hud-level").textContent = level;
  // Progress bar: progress within current level
  const levelPoints = points - (level - 1) * POINTS_TO_LEVEL_UP;
  const pct = Math.min(100, (levelPoints / POINTS_TO_LEVEL_UP) * 100);
  document.getElementById("progress-bar").style.width = pct + "%";
}

function updateStreak() {
  for (let i = 1; i <= 10; i++) {
    const el = document.getElementById("ss" + i);
    if (i <= streak) {
      el.classList.add("lit");
    } else {
      el.classList.remove("lit");
    }
  }
}

// ============================================================
//  QUESTION GENERATION
// ============================================================

function getRandomItems(arr, n, exclude = []) {
  const filtered = arr.filter(item => !exclude.includes(item));
  const shuffled = [...filtered].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, n);
}

function pickUnique(arr) {
  // Pick a random item from arr that hasn't been seen recently.
  // Once we've used half the pool, clear the history so items can repeat.
  function getPrefix(a) {
    if (a === PICTURE_WORDS) return 'pw';
    if (a === SIMPLE_SENTENCES) return 'ss';
    if (a === HARDER_SENTENCES) return 'hs';
    if (a === RHYMING_QUESTIONS) return 'rq';
    if (a === VOCAB_QUESTIONS) return 'vq';
    if (a === ANTONYM_QUESTIONS) return 'aq';
    if (a === PASSAGE_QUESTIONS) return 'pq';
    if (a === MINI_PASSAGE_QUESTIONS) return 'mp';
    return 'hp';
  }
  const pfx = getPrefix(arr);
  const available = arr.filter((_, i) => !recentQuestions.has(pfx + i));
  const pool = available.length > 0 ? available : arr;
  if (available.length === 0) {
    for (const key of [...recentQuestions]) { if (key.startsWith(pfx)) recentQuestions.delete(key); }
  }
  const idx = Math.floor(Math.random() * pool.length);
  const origIdx = arr.indexOf(pool[idx]);
  const prefix = pfx;
  recentQuestions.add(prefix + origIdx);
  return pool[idx];
}

function generateQuestion() {
  // Determine question type based on level
  if (level <= 2) return genTier1Question();
  if (level <= 4) return genTier2Question();
  if (level <= 6) return genTier3Question();
  if (level <= 8) return genTier4Question();
  return genTier5Question();
}

// TIER 1 (Levels 1-2): Picture word matching + simple fill-in-the-blank
function genTier1Question() {
  if (Math.random() < 0.5) {
    // Picture word match
    const item = pickUnique(PICTURE_WORDS);
    let wrongItems = getRandomItems(PICTURE_WORDS, 3, [item]).map(w => w.word);
    let options = [item.word, ...wrongItems];
    options.sort(() => Math.random() - 0.5);
    return {
      type: "picture",
      prompt: "What is this?",
      display: item.emoji,
      displayIsEmoji: true,
      hint: "Read each word carefully!",
      answer: item.word,
      options: options,
    };
  } else {
    // Simple fill-in-the-blank
    const q = pickUnique(SIMPLE_SENTENCES);
    return {
      type: "sentence",
      prompt: "Fill in the blank",
      display: q.prompt,
      hint: "",
      answer: q.answer,
      options: [...q.options].sort(() => Math.random() - 0.5),
      isSentence: true,
    };
  }
}

// TIER 2 (Levels 3-4): Harder sentences + rhyming words + mini reading comprehension
function genTier2Question() {
  const r = Math.random();
  if (r < 0.35) {
    const q = pickUnique(HARDER_SENTENCES);
    return {
      type: "sentence",
      prompt: "Fill in the blank",
      display: q.prompt,
      hint: "Think about what makes sense!",
      answer: q.answer,
      options: [...q.options].sort(() => Math.random() - 0.5),
      isSentence: true,
    };
  } else if (r < 0.65) {
    const q = pickUnique(RHYMING_QUESTIONS);
    return {
      type: "sentence",
      prompt: "Rhyming words",
      display: q.prompt,
      hint: "Which word sounds like it at the end?",
      answer: q.answer,
      options: [...q.options].sort(() => Math.random() - 0.5),
      isSentence: true,
    };
  } else {
    // Mini reading comprehension
    const q = pickUnique(MINI_PASSAGE_QUESTIONS);
    return {
      type: "passage",
      prompt: "Read, then answer",
      display: q.passage,
      question: q.question,
      hint: "Read both sentences carefully!",
      answer: q.answer,
      options: [...q.options].sort(() => Math.random() - 0.5),
      isPassage: true,
    };
  }
}

// TIER 3 (Levels 5-6): Vocabulary meanings + antonyms + mini reading comprehension
function genTier3Question() {
  const r = Math.random();
  if (r < 0.33) {
    const q = pickUnique(VOCAB_QUESTIONS);
    return {
      type: "sentence",
      prompt: "Word meanings",
      display: q.prompt,
      hint: "Think about what the word means!",
      answer: q.answer,
      options: [...q.options].sort(() => Math.random() - 0.5),
      isSentence: true,
    };
  } else if (r < 0.66) {
    const q = pickUnique(ANTONYM_QUESTIONS);
    return {
      type: "sentence",
      prompt: "Opposites",
      display: q.prompt,
      hint: "What means the opposite?",
      answer: q.answer,
      options: [...q.options].sort(() => Math.random() - 0.5),
      isSentence: true,
    };
  } else {
    // Mini reading comprehension
    const q = pickUnique(MINI_PASSAGE_QUESTIONS);
    return {
      type: "passage",
      prompt: "Read, then answer",
      display: q.passage,
      question: q.question,
      hint: "Read carefully!",
      answer: q.answer,
      options: [...q.options].sort(() => Math.random() - 0.5),
      isPassage: true,
    };
  }
}

// TIER 4 (Levels 7-8): Reading passages with comprehension questions
function genTier4Question() {
  const q = pickUnique(PASSAGE_QUESTIONS);
  return {
    type: "passage",
    prompt: "Read the story, then answer",
    display: q.passage,
    question: q.question,
    hint: "",
    answer: q.answer,
    options: [...q.options].sort(() => Math.random() - 0.5),
    isPassage: true,
  };
}

// TIER 5 (Levels 9-10): Harder comprehension with inference
function genTier5Question() {
  const isChapterChallenge = level >= 11;
  const q = pickUnique(isChapterChallenge ? CHAPTER_BOOK_QUESTIONS : HARD_PASSAGE_QUESTIONS);
  return {
    type: "passage",
    prompt: isChapterChallenge ? "Chapter book challenge" : "Read carefully, then answer",
    display: q.passage,
    question: q.question,
    hint: isChapterChallenge ? "Use details from the whole passage!" : "Think about WHY things happen!",
    answer: q.answer,
    options: [...q.options].sort(() => Math.random() - 0.5),
    isPassage: true,
  };
}

// ============================================================
//  RENDER QUESTION
// ============================================================

function nextQuestion() {
  isAnswering = false;
  const q = generateQuestion();
  const promptEl = document.getElementById("q-prompt");
  const displayEl = document.getElementById("q-display");
  const hintEl = document.getElementById("q-hint");
  const feedbackEl = document.getElementById("feedback");
  const grid = document.getElementById("answers-grid");

  promptEl.textContent = q.prompt;
  hintEl.textContent = q.hint || "";
  feedbackEl.innerHTML = "&nbsp;";
  feedbackEl.className = "feedback";

  // Display
  displayEl.className = "question-display";
  if (q.displayIsEmoji) {
    displayEl.innerHTML = `<span class="picture-emoji">${q.display}</span>`;
  } else if (q.isPassage) {
    displayEl.classList.add("passage-mode");
    displayEl.innerHTML =
      `<div class="passage-text">${q.display}</div>` +
      `<div class="passage-question">${q.question}</div>`;
  } else if (q.isSentence) {
    displayEl.classList.add("sentence-mode");
    displayEl.textContent = q.display;
  } else {
    displayEl.textContent = q.display;
  }

  // Answer buttons - passages and sentences use single column
  const useSingleCol = q.isSentence || q.isPassage;
  grid.innerHTML = "";
  grid.className = "answers-grid" + (useSingleCol ? " single-col" : "");

  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "answer-btn" + (useSingleCol ? " sentence-opt" : "");
    btn.textContent = opt;
    btn.addEventListener("click", () => handleAnswer(btn, opt, q.answer));
    grid.appendChild(btn);
  });
}

function handleAnswer(btn, selected, correct) {
  if (isAnswering) return;
  isAnswering = true;

  const feedbackEl = document.getElementById("feedback");
  const allBtns = document.querySelectorAll(".answer-btn");

  if (selected === correct) {
    // CORRECT
    btn.classList.add("correct");
    sfxCorrect();
    streak = Math.min(streak + 1, 10);
    const bonus = streak >= 10 ? STREAK_BONUS : 0;
    const earned = POINTS_PER_CORRECT + bonus;
    points += earned;
    totalCorrect++;
    totalQuestions++;
    questionsInLevel++;

    feedbackEl.textContent = CORRECT_MESSAGES[Math.floor(Math.random() * CORRECT_MESSAGES.length)];
    feedbackEl.className = "feedback correct-fb";
    if (bonus > 0) {
      feedbackEl.textContent += ` (+${bonus} bonus!)`;
    }

    updateStreak();
    updateHUD();

    // Check level up
    if (points >= level * POINTS_TO_LEVEL_UP && level < MAX_LEVEL) {
      setTimeout(() => levelUp(), 800);
    } else if (level >= MAX_LEVEL && points >= MAX_LEVEL * POINTS_TO_LEVEL_UP) {
      setTimeout(() => completeGame(), 800);
    } else {
      setTimeout(() => nextQuestion(), 1000);
    }
  } else {
    // WRONG
    btn.classList.add("wrong");
    sfxWrong();
    streak = 0;
    totalQuestions++;

    feedbackEl.textContent = WRONG_MESSAGES[Math.floor(Math.random() * WRONG_MESSAGES.length)];
    feedbackEl.className = "feedback wrong-fb";

    updateStreak();

    // Highlight correct answer
    allBtns.forEach(b => {
      if (b.textContent === correct) {
        b.style.border = "3px solid " + getComputedStyle(document.documentElement).getPropertyValue('--green');
        b.style.background = "#D1FAE5";
        b.style.color = "#065F46";
      }
    });

    // Allow retry after delay (new question)
    setTimeout(() => {
      isAnswering = false;
      nextQuestion();
    }, 1500);
  }
}

// ============================================================
//  LEVEL UP
// ============================================================

function levelUp() {
  level++;
  questionsInLevel = 0;
  sfxLevelUp();
  spawnConfetti();

  document.getElementById("lu-emoji").textContent = ["🎉", "🌟", "🏆", "🦄", "🎊", "💖", "🌈", "✨", "🎈"][level % 9];
  document.getElementById("lu-title").textContent = `Level ${level}!`;
  document.getElementById("lu-msg").textContent = LEVELUP_MESSAGES[Math.min(level - 2, LEVELUP_MESSAGES.length - 1)];

  // Video reward — every level-up (no repeats back-to-back)
  const container = document.getElementById("lu-video-container");
  let idx = Math.floor(Math.random() * VIDEO_POOL.length);
  if (VIDEO_POOL.length > 1 && idx === lastVideoIndex) {
    idx = (idx + 1) % VIDEO_POOL.length;
  }
  lastVideoIndex = idx;
  container.innerHTML = `<iframe src="${VIDEO_POOL[idx]}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;

  document.getElementById("overlay-levelup").classList.add("active");
  updateHUD();
}

function closeLevelUp() {
  sfxClick();
  // Stop any playing video
  const container = document.getElementById("lu-video-container");
  const iframes = container.querySelectorAll("iframe");
  iframes.forEach(f => f.src = "");

  document.getElementById("overlay-levelup").classList.remove("active");
  nextQuestion();
}

function completeGame() {
  sfxLevelUp();
  spawnConfetti();
  const accuracy = totalQuestions > 0 ? Math.round((totalCorrect / totalQuestions) * 100) : 0;
  document.getElementById("completion-stats").innerHTML =
    `⭐ Points: <strong>${points}</strong><br>` +
    `✅ Correct: <strong>${totalCorrect} / ${totalQuestions}</strong><br>` +
    `🎯 Accuracy: <strong>${accuracy}%</strong><br>` +
    `🏆 You reached <strong>Level ${MAX_LEVEL}</strong>!`;
  document.getElementById("hud").style.display = "none";
  document.getElementById("progress-wrap").style.display = "none";
  showScreen("screen-complete");
}

// ============================================================
//  CONFETTI
// ============================================================

function spawnConfetti() {
  const colors = ["#FF6B9D", "#C084FC", "#60A5FA", "#34D399", "#FBBF24", "#FB923C"];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement("div");
    el.className = "confetti-piece";
    el.style.left = Math.random() * 100 + "vw";
    el.style.top = "-20px";
    el.style.width = (6 + Math.random() * 8) + "px";
    el.style.height = (6 + Math.random() * 8) + "px";
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
    el.style.opacity = 0.8 + Math.random() * 0.2;
    document.body.appendChild(el);

    const xDrift = (Math.random() - 0.5) * 200;
    const duration = 1500 + Math.random() * 2000;
    const delay = Math.random() * 500;

    el.animate([
      { transform: `translateY(0) translateX(0) rotate(0deg)`, opacity: 1 },
      { transform: `translateY(${window.innerHeight + 40}px) translateX(${xDrift}px) rotate(${360 + Math.random() * 360}deg)`, opacity: 0 }
    ], { duration, delay, easing: "ease-in", fill: "forwards" });

    setTimeout(() => el.remove(), duration + delay + 100);
  }
}
